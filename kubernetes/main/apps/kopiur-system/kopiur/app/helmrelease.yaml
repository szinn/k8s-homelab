---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 0.11.2
      url: oci://ghcr.io/home-operations/charts/kopiur
  interval: 1h
  values:
    # logging:
    #   level: debug,kopia=debug
    features:
      # Grants the operator secrets create/patch/delete so it can project
      # kopiur-ragnar-secret into mover namespaces (spec.credentialProjection).
      credentialProjection:
        enabled: true
    extraVolumes:
      - name: repo
        nfs:
          server: ragnar.zinn.tech
          path: /mnt/atlas/k8s/main/kopiur
    extraVolumeMounts:
      - name: repo
        mountPath: /repo
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      runAsUser: 2000
      runAsGroup: 2000
      fsGroup: 2000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
