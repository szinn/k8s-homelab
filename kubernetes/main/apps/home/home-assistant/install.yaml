---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: home-assistant
spec:
  targetNamespace: home
  path: ./kubernetes/main/apps/home/home-assistant/app
  sourceRef:
    kind: ExternalArtifact
    name: home-assistant
    namespace: flux-system
  components:
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: home-assistant
      # Keep the kopia source path the deployment version used, so the
      # restore and future snapshots continue the existing history.
      KOPIUR_SOURCE_PATH: /pvc/home-assistant-config
      KOPIUR_CAPACITY: 8Gi
      KOPIUR_PUID: "65534"
      KOPIUR_PGID: "65533"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
