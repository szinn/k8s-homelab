---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name k8s-homelab-runner
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  dependsOn:
    - name: actions-runner-controller
      namespace: actions-runner-system
    - name: openebs
      namespace: system
  values:
    runnerScaleSetName: k8s-homelab-runner
    githubConfigUrl: https://github.com/szinn/k8s-homelab
    githubConfigSecret: k8s-homelab-runner-secret
    minRunners: 1
    maxRunners: 3
    containerMode:
      type: dind
      # kubernetesModeWorkVolumeClaim:
      #   accessModes: ["ReadWriteOnce"]
      #   storageClassName: openebs-hostpath
      #   resources:
      #     requests:
      #       storage: 25Gi
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          runner: *name
      spec:
        # initContainers:
        #   - name: take-cache-dir-ownership
        #     image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        #     command:
        #       - chown
        #       - -R
        #       - 1001:1001
        #       - /home/runner/cache
        #     volumeMounts:
        #       - mountPath: /home/runner/cache
        #         name: cache-volume
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    runner: *name
                topologyKey: kubernetes.io/hostname
        # initContainers:
        #   - name: take-cache-dir-ownership
        #     image: alpine:3@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
        #     command:
        #       - chown
        #       - -R
        #       - 1001:1001
        #       - /home/runner/cache
        #     volumeMounts:
        #       - mountPath: /home/runner/cache
        #         name: cache-volume
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command: ["/home/runner/run.sh"]
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
                  - SYS_ADMIN
            volumeMounts:
              - mountPath: /var/run/secrets/talos.dev
                name: talos
                readOnly: true
            #   - mountPath: /home/runner/cache
            #     name: cache-volume
        serviceAccountName: *name
        volumes:
          - name: talos
            secret:
              secretName: *name
        # - name: cache-volume
        #   persistentVolumeClaim:
        #   claimName: actions-runner-controller-cache
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
