---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backups-pvc.yaml
  - secrets.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: postgres-backup-scripts
    files:
      - backup.sh=./resources/backup.sh
generatorOptions:
  disableNameSuffixHash: true
