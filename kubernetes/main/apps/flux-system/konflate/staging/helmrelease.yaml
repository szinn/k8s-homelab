---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate-staging
spec:
  chart:
    kind: OCIRepository
    spec:
      interval: 15m
      layerSelector:
        mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
        operation: copy
      ref:
        tag: 0.6.6
      url: oci://ghcr.io/home-operations/charts/konflate
  interval: 1h
  values:
    config:
      repo: github://szinn/k8s-homelab
      clusterPath: kubernetes/staging
      prFilterExpr: pr.labels.exists(l, l.name == "cluster/staging")
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.zinn.ca
      mcp: true
    secret:
      existingSecret: konflate-webhook-token-secret
    httpRoute:
      enabled: true
      annotations:
        external-dns/is-public: "true"
        external-dns.kubernetes.io/target: external.zinn.ca
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.zinn.ca"
    monitoring:
      serviceMonitor:
        enabled: true
