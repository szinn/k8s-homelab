---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: freshrss
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      freshrss:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostUsers: false
        containers:
          freshrss:
            image:
              repository: freshrss/freshrss
              tag: 1.30.0-alpine@sha256:fcff0b573f2bf3aff375c7de08e26588d752a63094e161b3276ec26736ce17fd
            env:
              CRON_MIN: "*"
              DOMAIN: freshrss.zinn.ca
              LISTEN: &port 8080
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              requests:
                cpu: 12m
                memory: 128M
              limits:
                memory: 512M
    persistence:
      data:
        existingClaim: freshrss-config
        advancedMounts:
          freshrss:
            freshrss:
              - path: /var/www/FreshRSS/data
                subPath: data
                readOnly: false
              - path: /var/www/FreshRSS/extensions
                subPath: extensions
                readOnly: false
      tmpfs:
        type: emptyDir
        advancedMounts:
          freshrss:
            freshrss:
              - path: /var/www/FreshRSS/data/cache
                subPath: cache
    route:
      freshrss:
        hostnames: ["{{ .Release.Name }}.zinn.ca"]
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      freshrss:
        ports:
          http:
            port: *port
