---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mailkeep
spec:
  targetNamespace: self-hosted
  path: ./kubernetes/main/apps/self-hosted/mailkeep/app
  sourceRef:
    kind: ExternalArtifact
    name: mailkeep
    namespace: flux-system
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/zeroscaler
  postBuild:
    substitute:
      APP: mailkeep
      CONTROLLER: StatefulSet
      KOPIUR_CLAIM: data
      # Keep the kopia source path the deployment version used, so the
      # restore and future snapshots continue the existing history.
      KOPIUR_SOURCE_PATH: /pvc/mailkeep-config
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_PUID: "1234"
      KOPIUR_PGID: "1234"
      KOPIUR_RUNASNONROOT: "true"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
