---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: dashy-icons
    files:
      - bookboss.png=./icons/bookboss.png.bin
      - connect.jpg=./icons/connect.jpg.bin
      - database-storage.png=./icons/database-storage.png.bin
      - mailkeep.png=./icons/mailkeep.png.bin
      - pikvm.png=./icons/pikvm.png.bin
      - pikvm-light.png=./icons/pikvm-light.png.bin
generatorOptions:
  disableNameSuffixHash: true
# Temporary: lets the kopiur webhook accept the move to the default kopia
# source path (/pvc/<app>). Remove once the SnapshotPolicy has reconciled.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: not-used
        annotations:
          kopiur.home-operations.com/allow-identity-change: "true"
