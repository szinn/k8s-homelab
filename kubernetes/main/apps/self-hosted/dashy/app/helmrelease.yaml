---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      dashy:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: config
              accessMode: ReadWriteOnce
              size: 1Gi
              storageClass: ceph-block
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
              globalMounts:
                - path: /app/user-data
        containers:
          dashy:
            image:
              repository: ghcr.io/lissy93/dashy
              tag: 4.10.2@sha256:f998e7959e338bf29e74d0a24a5d30ad0e98568dffb43af0ce24fd9b9c4c958d
            env:
              TZ: America/Toronto
              DISABLE_CONFIG_BACKUPS: true
    service:
      dashy:
        ports:
          http:
            port: &mainPort 8080
    route:
      dashy:
        hostnames: ["dashy.zinn.ca"]
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashy
                port: *mainPort
    persistence:
      icons:
        enabled: true
        type: configMap
        name: dashy-icons
        advancedMounts:
          dashy:
            dashy:
              - path: /app/user-data/item-icons
                readOnly: true
      backup:
        existingClaim: self-hosted-backups
        advancedMounts:
          dashy:
            dashy:
              - path: /backups
                subPath: dashy
