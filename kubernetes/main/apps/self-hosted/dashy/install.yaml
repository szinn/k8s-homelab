---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dashy
spec:
  targetNamespace: self-hosted
  path: ./kubernetes/main/apps/self-hosted/dashy/app
  sourceRef:
    kind: ExternalArtifact
    name: dashy
    namespace: flux-system
  components:
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: dashy
      # Keep the kopia source path the deployment version used, so the
      # restore and future snapshots continue the existing history.
      KOPIUR_SOURCE_PATH: /pvc/dashy-config
      KOPIUR_CAPACITY: 1Gi
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
