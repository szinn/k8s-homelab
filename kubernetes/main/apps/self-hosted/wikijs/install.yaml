---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wikijs-db
spec:
  targetNamespace: dbms
  path: ./kubernetes/main/apps/self-hosted/wikijs/db
  sourceRef:
    kind: ExternalArtifact
    name: wikijs
    namespace: flux-system
  dependsOn:
    - name: cloudnative-pg-cluster
      namespace: dbms
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: has(status.applied) && status.applied
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: has(status.applied) && status.applied
  prune: true
  wait: true
  interval: 30m
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wikijs
spec:
  targetNamespace: self-hosted
  path: ./kubernetes/main/apps/self-hosted/wikijs/app
  sourceRef:
    kind: ExternalArtifact
    name: wikijs
    namespace: flux-system
  dependsOn:
    - name: wikijs-db
  components:
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: wikijs
      KOPIUR_CLAIM: data
      # Keep the kopia source path the deployment version used, so the
      # restore and future snapshots continue the existing history.
      KOPIUR_SOURCE_PATH: /pvc/wikijs-data
      KOPIUR_CAPACITY: 15Gi
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
