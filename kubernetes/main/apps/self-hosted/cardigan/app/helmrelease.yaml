---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cardigan
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    defaultPodOptions:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsUser: 1234
        runAsGroup: 1234
        runAsNonRoot: true
        fsGroup: 1234
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cardigan:
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: cardigan-secret
        pod:
          enableServiceLinks: false
          terminationGracePeriodSeconds: 30
        containers:
          cardigan:
            image:
              repository: ghcr.io/szinn/cardigan
              tag: v0.1.1@sha256:b852b4e52e0fad33015794ccff8590228b5ae54e07c270f83a744ea590cca561
            env:
              CARDIGAN_DATABASE_PATH: /data
              TZ: "America/Toronto"
              RUST_LOG: "DEBUG"
            envFrom:
              - secretRef:
                  name: cardigan-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      data:
        existingClaim: cardigan-config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
