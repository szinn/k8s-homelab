---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cardigan
spec:
  targetNamespace: self-hosted
  path: ./kubernetes/main/apps/self-hosted/cardigan/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/kopiur/kopiur
    - ../../../../components/kopiur/pvc
  postBuild:
    substitute:
      APP: cardigan
      KOPIUR_CLAIM: cardigan-config
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_PUID: "1234"
      KOPIUR_PGID: "1234"
      KOPIUR_RUNASNONROOT: "true"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
