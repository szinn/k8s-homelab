---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: issueboss
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: issueboss-secret
    creationPolicy: Owner
    template:
      data:
        # issueboss
        ISSUEBOSS__DATABASE_URL: "postgres://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@postgres-18-rw.dbms.svc.cluster.local.:5432/issueboss"
  dataFrom:
    - extract:
        key: issueboss
