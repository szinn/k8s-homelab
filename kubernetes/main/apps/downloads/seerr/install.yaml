---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr
spec:
  targetNamespace: downloads
  path: ./kubernetes/main/apps/downloads/seerr/app
  sourceRef:
    kind: ExternalArtifact
    name: seerr
    namespace: flux-system
  components:
    - ../../../../components/kopiur/statefulset
    - ../../../../components/zeroscaler
  postBuild:
    substitute:
      APP: seerr
      CONTROLLER: StatefulSet
      # Keep the kopia source path the deployment version used, so the
      # restore and future snapshots continue the existing history.
      KOPIUR_SOURCE_PATH: /pvc/seerr-config
      KOPIUR_CAPACITY: 5Gi
  prune: true
  wait: false
  interval: 1h
  timeout: 5m
