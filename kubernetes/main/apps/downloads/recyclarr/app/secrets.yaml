---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secrets
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: recyclarr
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      data:
        SONARR_APIKEY: "{{ .sonarr_API_KEY }}"
        RADARR_APIKEY: "{{ .radarr_API_KEY }}"
        RADARR_4K_APIKEY: "{{ .radarr_4k_API_KEY }}"
        RECYCLARR_APIKEY: "{{ .recyclarr_API_KEY }}"
  dataFrom:
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "radarr_$1"
    - extract:
        key: radarr-4k
      rewrite:
        - regexp:
            source: "(.*)"
            target: "radarr_4k_$1"
    - extract:
        key: recyclarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "recyclarr_$1"
    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: "(.*)"
            target: "sonarr_$1"
