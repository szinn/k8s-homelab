---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - helmrelease.yaml

configMapGenerator:
  - name: qbittorrent-coredns
    files:
      - ./config/Corefile
  - name: qbittorrent-loki-rules
    files:
      - qbittorrent.yaml=./lokirule.yaml
    options:
      labels:
        loki_rule: "true"
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
# Temporary: lets the kopiur webhook accept the move to the default kopia
# source path (/pvc/<app>). Remove once the SnapshotPolicy has reconciled.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: not-used
        annotations:
          kopiur.home-operations.com/allow-identity-change: "true"
