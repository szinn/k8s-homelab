---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelfmark
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      shelfmark:
        annotations:
          secret.reloader.stakater.com/reload: shelfmark-secret

        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: "OnRootMismatch"

        initContainers:
          # wg-quick needs src_valid_mark=1 in the pod netns; /proc/sys is
          # read-only for unprivileged containers and the sysctl is not on
          # kubelet's safe list, so set it here.
          sysctl:
            image: &image
              repository: ghcr.io/calibrain/shelfmark
              tag: v1.7.0@sha256:6544e02595271b0267b9acda58fa7f3db6f14942bece51b7aadfe4000cf34f1c
            command:
              - sysctl
              - -w
              - net.ipv4.conf.all.src_valid_mark=1
            securityContext:
              privileged: true
              runAsUser: 0

        containers:
          shelfmark:
            image: *image
            # Image defaults to iptables-legacy; Talos only supports nftables,
            # so wg-quick fails on the legacy 'raw' table. Switch to nft first.
            # The pod netns outlives container restarts, so clear any wg0,
            # policy rules and firewall state left by a previous attempt.
            command:
              - /bin/sh
              - -c
              - |
                for t in iptables ip6tables; do
                  update-alternatives --set "$t" "/usr/sbin/$t-nft" >/dev/null
                done
                ip link delete wg0 2>/dev/null || true
                while ip -4 rule delete table 51820 2>/dev/null; do :; done
                while ip -4 rule delete table main suppress_prefixlength 0 2>/dev/null; do :; done
                for tbl in filter nat mangle raw; do
                  iptables -t "$tbl" -F 2>/dev/null || true
                  iptables -t "$tbl" -X 2>/dev/null || true
                done
                iptables -P OUTPUT ACCEPT 2>/dev/null || true
                exec /app/entrypoint.sh
            env:
              CACHE_DIR: /cache
              INGEST_DIR: /bookdrop
              LOG_LEVEL: DEBUG
              PUID: 1000
              PGID: 1000
              USING_WIREGUARD: true
              WIREGUARD_DNS: "1.1.1.1,8.8.8.8"
              # Keep only cluster + node networks off-tunnel. The default
              # (all RFC1918) also catches PIA's in-tunnel DNS (10.0.0.243),
              # sending it out eth0 where nothing answers.
              LAN_NETWORK: "10.200.0.0/16,10.201.0.0/16,10.11.0.0/16"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 8084
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 2Gi
            # entrypoint.sh must start as root to bring up wg0 and the
            # kill-switch, then drops to PUID/PGID via gosu. It writes to
            # /etc/wireguard, /etc/resolv.conf and /app, so the rootfs is rw.
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_ADMIN
                  - NET_RAW
    persistence:
      config:
        existingClaim: shelfmark-config

      nfs-nas-media:
        type: nfs
        server: ragnar.zinn.tech
        path: /mnt/atlas/media/BookLibrary/Bookdrop
        globalMounts:
          - path: /bookdrop

      wireguard-config:
        enabled: true
        type: secret
        name: shelfmark-secret
        items:
          - key: wireguard_config
            path: wg0.conf
        defaultMode: 256
        globalMounts:
          - path: /config/wg0.conf
            subPath: wg0.conf
            readOnly: true

      tmpfs:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /home/shelfmark/.gunicorn
            subPath: gunicorn
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
          - path: /run
            subPath: run
          - path: /var/log
            subPath: log

    route:
      shelfmark:
        hostnames:
          - "{{ .Release.Name }}.zinn.ca"
        parentRefs:
          - name: envoy-internal
            namespace: network

    service:
      shelfmark:
        ports:
          http:
            port: *port
