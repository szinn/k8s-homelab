---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - secrets.yaml
# Temporary: lets the kopiur webhook accept the move to the default kopia
# source path (/pvc/<app>). Remove once the SnapshotPolicy has reconciled.
patches:
  - target:
      kind: SnapshotPolicy
    patch: |
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: not-used
        annotations:
          kopiur.home-operations.com/allow-identity-change: "true"
