---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookboss-pg-role
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookboss-pg-role
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      type: kubernetes.io/basic-auth
      data:
        username: bookboss
        password: "{{ .DB_PASSWORD }}"
  dataFrom:
    - extract:
        key: bookboss
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/databaserole_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: bookboss
spec:
  cluster:
    name: postgres-18
  name: bookboss
  login: true
  passwordSecret:
    name: bookboss-pg-role
  databaseRoleReclaimPolicy: retain
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: bookboss
spec:
  cluster:
    name: postgres-18
  name: bookboss
  owner: bookboss
  databaseReclaimPolicy: retain
