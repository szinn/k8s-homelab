---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 1h
  values:
    autoEvictAfter: 1h
    drbd:
      alExtents: 6007
    groupSnapshots:
      enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    replicaCount: 2
  # Chart has no knob for this. Agent readiness doesn't reflect DRBD state, so
  # without a hold the DaemonSet restarts every node's agent ~15s apart and
  # diskless replicas can rejoin with a stale exposed UUID mid-rollout.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: miroir-agent
            patch: |-
              - op: add
                path: /spec/minReadySeconds
                value: 120
