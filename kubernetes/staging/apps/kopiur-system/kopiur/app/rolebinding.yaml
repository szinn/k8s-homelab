---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
# Lets the console's Doctor page read the controller Deployment (chart Role).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kopiur-ui-doctor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kopiur-ui-doctor
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: kopiur-ui-anonymous
