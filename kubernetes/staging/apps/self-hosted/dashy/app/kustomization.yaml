---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: dashy-icons
    files:
      - connect.jpg=./icons/connect.jpg.bin
      - database-storage.png=./icons/database-storage.png.bin
      - pikvm.png=./icons/pikvm.png.bin
      - pikvm-light.png=./icons/pikvm-light.png.bin
generatorOptions:
  disableNameSuffixHash: true
