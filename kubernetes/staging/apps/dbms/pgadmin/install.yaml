---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin
spec:
  targetNamespace: dbms
  path: ./kubernetes/staging/apps/dbms/pgadmin/app
  sourceRef:
    kind: ExternalArtifact
    name: pgadmin
    namespace: flux-system
  components:
    - ../../../../components/kopiur/statefulset
  postBuild:
    substitute:
      APP: pgadmin
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
  # Temporary: lets the kopiur webhook accept the move to the default
  # kopia source path (/pvc/${APP}). Remove once the policy has reconciled.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: not-used
          annotations:
            kopiur.home-operations.com/allow-identity-change: "true"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
