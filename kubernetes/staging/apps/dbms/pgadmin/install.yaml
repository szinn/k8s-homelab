---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin
spec:
  targetNamespace: dbms
  path: ./kubernetes/staging/apps/dbms/pgadmin/app
  sourceRef:
    kind: ExternalArtifact
    name: pgadmin
    namespace: flux-system
  components:
    - ../../../../components/kopiur/deployment
  postBuild:
    substitute:
      APP: pgadmin
      KOPIUR_CLAIM: pgadmin-config
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
